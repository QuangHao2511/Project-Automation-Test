name: Playwright Daily Automation Test CI

on:
  schedule:
    # Chạy tự động lúc 07:00 sáng hàng ngày (UTC+7 -> 00:00 UTC)
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  daily_regression_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run All Regression Test Cases
        run: |
          # conftest.py sẽ tự động tạo auth_state trước khi chạy test
          pytest tests/ -v

      - name: Upload Daily Test Artifacts (Reports & Evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-execution-reports-${{ github.run_id }}
          path: |
            reports/
          retention-days: 14