name: Playwright Daily Automation Test CI

on:
  schedule:
    # Chạy tự động lúc 07:00 sáng mỗi ngày (UTC+7 -> 00:00 UTC)
    - cron: '0 0 * * *'
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily_regression_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java (Cần cho Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Allure CLI
        run: |
          sudo npm install -g allure-commandline --save-dev

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run All Regression Test Cases
        run: |
          pytest tests/ -v --alluredir=reports/allure-results

      - name: Generate Allure Report HTML
        if: always()
        run: |
          allure generate reports/allure-results --clean -o allure-report

      - name: Deploy Allure Report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Test Artifacts (Evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-execution-reports-${{ github.run_id }}
          path: reports/
          retention-days: 14