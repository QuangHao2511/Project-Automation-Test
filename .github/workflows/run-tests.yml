name: Playwright Daily Automation Test CI

on:
  schedule:
    - cron: '0 0 * * *'

  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

jobs:
  daily_regression_test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Auth Setup (Lưu phiên đăng nhập)
        run: |
          pytest tests/test_setup_auth.py

      - name: Run All Regression Test Cases
        run: |
          # Chạy toàn bộ các file test trong thư mục tests (trừ file setup auth)
          pytest tests/ --ignore=tests/test_setup_auth.py -v

      - name: Upload Daily Test Artifacts (Reports & Evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-test-execution-reports-${{ github.run_id }}
          path: |
            reports/
          retention-days: 14