name: Playwright Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & OS Dependencies
        run: |
          playwright install --with-deps chromium

      - name: Run Auth Setup (Generate Storage State)
        run: |
          pytest tests/test_setup_auth.py

      - name: Run Test Suite (Headless Mode)
        run: |
          pytest tests/test_login.py tests/test_cart.py

      - name: Upload Test Artifacts (Reports & Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-execution-reports
          path: |
            reports/
          retention-days: 14